<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // Store the path for restoration after redirect
    var pathSegments = window.location.pathname.slice(1).split('/').filter(Boolean);
    var search = window.location.search || '';
    
    sessionStorage.setItem('redirect', JSON.stringify({
      path: '/' + pathSegments.join('/'),
      search: search
    }));
    
    // Redirect to index
    window.location.replace(window.location.origin + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
